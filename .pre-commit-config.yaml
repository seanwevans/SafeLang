repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/pycqa/pylint
    rev: v3.3.1
    hooks:
      - id: pylint
        language_version: python3
        args: ["-E"]
        additional_dependencies:
          - pytest

  - repo: local
    hooks:
      - id: coverage
        name: coverage
        entry: python scripts/run_coverage.py
        language: python
        additional_dependencies:
          - coverage
          - pytest
          - coverage-badge
          - setuptools<81
          # The falsification tests skip themselves without a solver, so the
          # hook needs z3 to actually exercise safelang/adversary.py.
          - z3-solver>=4.12
        pass_filenames: false
