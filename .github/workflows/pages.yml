name: Pages

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - 'safelang/**'
      - 'example*.slang'
      - 'tests/test_sim_constants.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# publishing a half-uploaded site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install the verifier
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          # z3-solver backs the falsification verdicts the page draws.
          python -m pip install pytest 'z3-solver>=4.12'

      # The simulator quotes the compiler's own numbers. Refuse to publish a
      # page that has drifted away from what the analyser actually reports.
      - name: Check the page still agrees with the compiler
        run: |
          python -m safelang --time-report docs/sim.slang
          python -m pytest tests/test_sim_constants.py -v

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
