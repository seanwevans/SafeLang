name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/safelang-verifier
    permissions:
      # Required for PyPI Trusted Publishing; no API token is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c 'import safelang; print(safelang.__version__)')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $tag does not match safelang.__version__ $version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate the distributions
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          missing = [
              name
              for name in ("safelang/runtime.js", "safelang/__main__.py")
              if name not in names
          ]
          if missing:
              raise SystemExit(f"wheel is missing {missing}")
          print(f"{wheel} looks complete")
          PY

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags/')
        uses: pypa/gh-action-pypi-publish@release/v1
